name: Verify
on:
  push: { branches: [dev, main] }
  pull_request: {}
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541d5f0a0dca1c4cdb1552b9c0a8f5
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run lint && npm run typecheck && npm test && npm run build && npm run release:archive && npm run verify:release-archive && npm run validate:docs && npm run validate:governance && npm run validate:release && npm audit --omit=dev --audit-level=high
